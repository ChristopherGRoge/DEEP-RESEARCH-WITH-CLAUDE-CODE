<svg xmlns="http://www.w3.org/2000/svg" width="250" height="54" viewBox="0 0 250 54">
  <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
    <rect fill="#26272B" x="0" y="0" width="250" height="54" rx="10"/>
    <text font-family="Helvetica-Bold, Helvetica" font-size="9" font-weight="bold" fill="#FFFFFF" opacity="0.7">
      <tspan x="53" y="20">PRODUCT HUNT</tspan>
    </text>
    <text font-family="Helvetica-Bold, Helvetica" font-size="14" font-weight="bold" fill="#FFFFFF">
      <tspan x="52" y="38">#1 Product of the Day</tspan>
    </text>
    <!-- Medal icon -->
    <g transform="translate(10, 9)">
      <!-- Medal ribbon -->
      <path d="M11,0 L18,14 L25,0 L22,0 L18,8 L14,0 Z" fill="#DA552F"/>
      <!-- Medal circle -->
      <circle cx="18" cy="23" r="12" fill="#FFCF4A"/>
      <circle cx="18" cy="23" r="9" fill="#FFB800"/>
      <!-- Number 1 -->
      <text font-family="Helvetica-Bold, Helvetica" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        <tspan x="18" y="28">1</tspan>
      </text>
    </g>
  </g>
</svg>
