                    return `<div style="width: 80%; height: 80%; display: flex; align-items: center; justify-content: center;">${svg}</div>`;
                });

            // Add initials for entities WITHOUT logos
            nodes.filter(d => !d.logoUrl && !d.logoSvgContent)
                .append('text')
                .attr('class', 'entity-initial')
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .style('font-size', d => Math.max(10, getEntityBubbleSize(d.buzzScore, d.assertionCount) * 0.6) + 'px')
                .style('font-weight', '600')
                .style('fill', 'var(--text-tertiary)')
                .style('pointer-events', 'none')
                .text(d => d.name.charAt(0).toUpperCase());

            // Buzz score indicator (small badge for high-buzz entities)
            nodes.filter(d => (d.buzzScore || 0) > 0.5)
                .append('text')
                .attr('class', 'buzz-indicator')
                .attr('text-anchor', 'middle')
                .attr('dy', d => -getEntityBubbleSize(d.buzzScore, d.assertionCount) - 4)
                .style('font-size', '9px')
                .style('font-weight', '600')
                .style('fill', 'var(--status-validated)')
                .text(d => Math.round((d.buzzScore || 0) * 100));

            // Entity labels
            nodes.append('text')
                .attr('text-anchor', d => {
                    const pos = entityPositions.get(d.id);
                    if (!pos) return 'middle';
                    return Math.cos(pos.angle) > 0.2 ? 'start' : Math.cos(pos.angle) < -0.2 ? 'end' : 'middle';
                })
                .attr('dx', d => {
                    const pos = entityPositions.get(d.id);
                    if (!pos) return 0;
                    const r = getEntityBubbleSize(d.buzzScore, d.assertionCount);
                    return Math.cos(pos.angle) > 0.2 ? r + 8 : Math.cos(pos.angle) < -0.2 ? -r - 8 : 0;
                })
                .attr('dy', d => {
                    const pos = entityPositions.get(d.id);
                    if (!pos) return 4;
                    const r = getEntityBubbleSize(d.buzzScore, d.assertionCount);
                    if (Math.abs(Math.cos(pos.angle)) <= 0.2) {
                        return Math.sin(pos.angle) > 0 ? r + 16 : -r - 6;
                    }
                    return 4;
                })
                .style('font-size', d => (d.buzzScore || 0) > 0.6 ? '12px' : '11px')
                .style('font-weight', d => (d.buzzScore || 0) > 0.6 ? '500' : '400')
                .text(d => d.name.length > 18 ? d.name.substring(0, 15) + '...' : d.name);

            // Add ring labels
            const ringLabels = ['Low Buzz', '', 'Medium', '', 'High Buzz'];
            [0, 2, 4].forEach(i => {
                if (ringLabels[i]) {
                    const labelRadius = minRadius + ((maxRadius - minRadius) / (ringCount - 1)) * i;
                    g.append('text')
                        .attr('class', 'ring-label')
                        .attr('x', labelRadius + 5)
                        .attr('y', 4)
                        .style('font-size', '9px')
                        .style('fill', 'var(--text-muted)')
                        .style('font-style', 'italic')
                        .text(ringLabels[i]);
                }
            });

            // Initialize entity positions for collision simulation
            entities.forEach(entity => {
                const pos = entityPositions.get(entity.id);
                if (pos) {
                    entity.x = pos.x;
                    entity.y = pos.y;
                    entity.targetX = pos.x;
                    entity.targetY = pos.y;
                    entity.targetRadius = pos.radius;
                    entity.nodeRadius = getEntityBubbleSize(entity.buzzScore, entity.assertionCount);
                }
            });

            // Collision resolution simulation
            // Entities start at their ring positions, bounce if overlapping, then settle
            const simulation = d3.forceSimulation(entities)
                .force('collision', d3.forceCollide()
                    .radius(d => d.nodeRadius + 4) // Add small padding
                    .strength(0.7)
                )
                // Keep entities near their assigned ring radius
                .force('radial', d3.forceRadial(d => d.targetRadius, 0, 0).strength(0.15))
                // Gently pull entities toward their target positions
                .force('x', d3.forceX(d => d.targetX).strength(0.05))
                .force('y', d3.forceY(d => d.targetY).strength(0.05))
                .alphaDecay(0.025)
                .velocityDecay(0.35)
                .on('tick', () => {
                    nodes.attr('transform', d => `translate(${d.x}, ${d.y})`);
                    entityLinks.attr('x2', d => d.x).attr('y2', d => d.y);
                });

            // Stop simulation after 2.5 seconds (should be settled by then)
            const stopTimeout = setTimeout(() => {
                simulation.stop();
            }, 2500);

            // Store cleanup function
            state.cleanupAnimation = () => {
                simulation.stop();
                clearTimeout(stopTimeout);
            };
        }

        // =====================================================
        // VISUALIZATION - WORLD MODEL (Orbital Relationship Map)
        // =====================================================

        function renderWorldModel(data, animate = false) {
            if (!data || !data.entity) return;

            dom.canvas.innerHTML = '';

            const width = dom.canvas.clientWidth;
            const height = dom.canvas.clientHeight;
            const centerX = width / 2;
            const centerY = height / 2;

            const svg = d3.select('#grove-canvas')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Defs for arrowheads and gradients
            const defs = svg.append('defs');

            // Arrow markers for directed relationships
            const arrowTypes = [
                { type: 'depends', color: '#268bd2' },
                { type: 'enables', color: '#2aa198' },
                { type: 'forks', color: '#cb4b16' },
                { type: 'supersedes', color: '#6c71c4' }
            ];

            arrowTypes.forEach(rt => {
                defs.append('marker')
                    .attr('id', `arrow-${rt.type}`)
                    .attr('viewBox', '0 0 10 6')
                    .attr('refX', 10)
                    .attr('refY', 3)
                    .attr('markerWidth', 8)
                    .attr('markerHeight', 5)
                    .attr('orient', 'auto')
                    .append('path')
                    .attr('d', 'M0,0 L10,3 L0,6 Z')
                    .attr('fill', rt.color)
                    .attr('opacity', 0.7);
            });

            // Center glow gradient
            const glow = defs.append('radialGradient')
                .attr('id', 'center-glow');
            glow.append('stop').attr('offset', '0%').attr('stop-color', 'rgba(133, 153, 0, 0.1)');
            glow.append('stop').attr('offset', '100%').attr('stop-color', 'rgba(133, 153, 0, 0)');

            const g = svg.append('g')
                .attr('transform', `translate(${centerX}, ${centerY})`);

            // All relationships combined
            const allRels = [
                ...(data.relationships.outbound || []).map(r => ({...r, _dir: 'out'})),
                ...(data.relationships.inbound || []).map(r => ({...r, _dir: 'in'}))
            ];

            if (allRels.length === 0) {
                // No relationships - show empty state on canvas
                g.append('text')
                    .attr('text-anchor', 'middle')
                    .attr('dy', -20)
                    .style('font-family', 'var(--font-display)')
                    .style('font-size', '16px')
                    .style('font-weight', '600')
                    .style('fill', 'var(--text-primary)')
                    .text(data.entity.name);

                g.append('text')
                    .attr('text-anchor', 'middle')
                    .attr('dy', 10)
                    .style('font-family', 'var(--font-display)')
                    .style('font-size', '13px')
                    .style('fill', 'var(--text-muted)')
                    .text('No relationships mapped yet');

                return;
            }

            // Ring configuration - two concentric rings
            const innerRing = Math.min(width, height) * 0.20;
            const outerRing = Math.min(width, height) * 0.36;
            const centerRadius = 50;

            // Split into strong/weak for inner/outer ring placement
            const strongRels = allRels.filter(r => r.strength >= 0.7);
            const weakRels = allRels.filter(r => r.strength < 0.7);

            function assignPositions(rels, ringRadius) {
                const angleStep = (2 * Math.PI) / Math.max(rels.length, 1);
                rels.forEach((rel, i) => {
                    const angle = i * angleStep - Math.PI / 2;
                    rel._x = ringRadius * Math.cos(angle);
                    rel._y = ringRadius * Math.sin(angle);
                    rel._angle = angle;
                    rel._ringRadius = ringRadius;
                    rel._nodeRadius = 16 + rel.strength * 14;
                });
            }

            assignPositions(strongRels, innerRing);
            assignPositions(weakRels, outerRing);

            const positionedRels = [...strongRels, ...weakRels];

            // Animation timing
            const enterEase = d3.easeCubicOut;
            const ringDelay = 0;
            const linkDelay = animate ? 200 : 0;
            const nodeDelay = animate ? 350 : 0;
            const enterDuration = animate ? 500 : 0;

            // Background glow behind center
            const glowCircle = g.append('circle')
                .attr('r', innerRing * 0.7)
                .attr('fill', 'url(#center-glow)');
            if (animate) {
                glowCircle.style('opacity', 0)
                    .transition().duration(enterDuration).delay(ringDelay).ease(enterEase)
                    .style('opacity', 1);
            }

            // Ring guides
            const ringGuide1 = g.append('circle').attr('class', 'wm-ring-guide').attr('r', innerRing);
            const ringGuide2 = g.append('circle').attr('class', 'wm-ring-guide').attr('r', outerRing);
            if (animate) {
                [ringGuide1, ringGuide2].forEach(rg => {
                    rg.style('opacity', 0)
                        .transition().duration(enterDuration).delay(ringDelay).ease(enterEase)
                        .style('opacity', 1);
                });
            }

            // Ring labels
            const ringLabel1 = g.append('text')
                .attr('x', innerRing + 5).attr('y', 4)
                .style('font-size', '8px').style('fill', 'var(--text-muted)').style('font-style', 'italic')
                .text('Strong');
            const ringLabel2 = g.append('text')
                .attr('x', outerRing + 5).attr('y', 4)
                .style('font-size', '8px').style('fill', 'var(--text-muted)').style('font-style', 'italic')
                .text('Moderate');
            if (animate) {
                [ringLabel1, ringLabel2].forEach(rl => {
                    rl.style('opacity', 0)
                        .transition().duration(enterDuration).delay(ringDelay).ease(enterEase)
                        .style('opacity', 1);
                });
            }

            // Draw relationship links
            const links = g.selectAll('.wm-link')
                .data(positionedRels)
                .enter()
                .append('line')
                .attr('class', d => `wm-link wm-link-${relTypeClass(d.relationshipType)}`)
                .attr('x1', 0)
                .attr('y1', 0)
                .attr('x2', animate ? 0 : d => d._x)
                .attr('y2', animate ? 0 : d => d._y)
                .attr('stroke-width', d => 1 + d.strength * 2.5)
                .attr('marker-end', d => {
                    const cls = relTypeClass(d.relationshipType);
                    if (['depends', 'enables', 'forks', 'supersedes'].includes(cls)) {
                        return `url(#arrow-${cls})`;
                    }
                    return null;
                });

            if (animate) {
                links.transition()
                    .duration(enterDuration)
                    .delay(linkDelay)
                    .ease(enterEase)
                    .attr('x2', d => d._x)
                    .attr('y2', d => d._y);
            }

            // Related entity nodes
            const nodes = g.selectAll('.wm-node')
                .data(positionedRels)
                .enter()
                .append('g')
                .attr('class', 'wm-node')
                .attr('transform', animate ? 'translate(0, 0)' : d => `translate(${d._x}, ${d._y})`)
                .style('opacity', animate ? 0 : 1)
                .on('click', (event, d) => {
                    if (d.relatedEntity && d.relatedEntity.id) {
                        selectEntity(d.relatedEntity.id);
                    }
                })
                .on('mouseenter', (event, d) => showTooltip(event, d, 'worldmodel'))
                .on('mouseleave', hideTooltip);

            if (animate) {
                nodes.transition()
                    .duration(enterDuration)
                    .delay(nodeDelay)
                    .ease(enterEase)
                    .attr('transform', d => `translate(${d._x}, ${d._y})`)
                    .style('opacity', 1);
            }

            // Node circles colored by relationship type
            nodes.append('circle')
                .attr('class', 'wm-node-circle')
                .attr('r', d => d._nodeRadius)
                .style('stroke', d => getRelColor(d.relationshipType));

            // Node initials
            nodes.append('text')
                .attr('class', 'wm-node-initial')
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .style('font-size', d => (d._nodeRadius * 0.65) + 'px')
                .text(d => {
                    const name = d.relatedEntity ? d.relatedEntity.name : '?';
                    return name.charAt(0).toUpperCase();
                });

            // Node name labels (positioned radially)
            nodes.append('text')
                .attr('class', 'wm-node-label')
                .attr('text-anchor', d => {
                    return Math.cos(d._angle) > 0.2 ? 'start' : Math.cos(d._angle) < -0.2 ? 'end' : 'middle';
                })
                .attr('dx', d => {
                    const r = d._nodeRadius;
                    return Math.cos(d._angle) > 0.2 ? r + 6 : Math.cos(d._angle) < -0.2 ? -r - 6 : 0;
                })
                .attr('dy', d => {
                    const r = d._nodeRadius;
                    if (Math.abs(Math.cos(d._angle)) <= 0.2) {
                        return Math.sin(d._angle) > 0 ? r + 14 : -r - 6;
                    }
                    return 4;
                })
                .text(d => {
                    const name = d.relatedEntity ? d.relatedEntity.name : '?';
                    return name.length > 20 ? name.substring(0, 17) + '...' : name;
                });

            // Relationship type badge below name
            nodes.append('text')
                .attr('class', 'wm-node-type-badge')
                .attr('text-anchor', d => {
                    return Math.cos(d._angle) > 0.2 ? 'start' : Math.cos(d._angle) < -0.2 ? 'end' : 'middle';
                })
                .attr('dx', d => {
                    const r = d._nodeRadius;
                    return Math.cos(d._angle) > 0.2 ? r + 6 : Math.cos(d._angle) < -0.2 ? -r - 6 : 0;
                })
                .attr('dy', d => {
                    const r = d._nodeRadius;
                    if (Math.abs(Math.cos(d._angle)) <= 0.2) {
                        return Math.sin(d._angle) > 0 ? r + 25 : -r - 17;
                    }
                    return 16;
                })
                .style('fill', d => getRelColor(d.relationshipType))
                .text(d => relTypeLabel(d.relationshipType));

            // Central entity node (appears immediately in animation - represents the clicked entity)
            const centerNode = g.append('g').attr('class', 'wm-center');

            centerNode.append('circle')
                .attr('class', 'wm-center-circle')
                .attr('r', centerRadius);

            centerNode.append('text')
                .attr('class', 'wm-center-label')
                .attr('text-anchor', 'middle')
                .attr('dy', -4)
                .text(data.entity.name.length > 16 ? data.entity.name.substring(0, 13) + '...' : data.entity.name);

            centerNode.append('text')
                .attr('class', 'wm-center-sublabel')
                .attr('text-anchor', 'middle')
                .attr('dy', 12)
                .text(data.entity.entityType || 'entity');

            // Force field indicators
            const forces = data.forces;
            if (forces) {
                const indicatorBaseY = Math.min(width, height) * 0.43;

                if (forces.tailwinds && forces.tailwinds.length > 0) {
                    g.append('text')
                        .attr('class', 'wm-force-label')
                        .attr('x', -width * 0.36)
                        .attr('y', indicatorBaseY)
                        .style('fill', '#859900')
                        .text(`▲ ${forces.tailwinds.length} Tailwinds`);
                }

                if (forces.headwinds && forces.headwinds.length > 0) {
                    g.append('text')
                        .attr('class', 'wm-force-label')
                        .attr('x', width * 0.26)
                        .attr('y', indicatorBaseY)
                        .attr('text-anchor', 'end')
                        .style('fill', '#dc322f')
                        .text(`▼ ${forces.headwinds.length} Headwinds`);
                }

                // Gravitational ring around center
                if (forces.gravitational && forces.gravitational.length > 0) {
                    const avgStr = forces.gravitational.reduce((s, f) => s + f.strength, 0) / forces.gravitational.length;
                    g.append('circle')
                        .attr('r', centerRadius + 12)
                        .style('fill', 'none')
                        .style('stroke', 'rgba(38, 139, 210, 0.2)')
                        .style('stroke-width', 2 + avgStr * 4)
                        .style('stroke-dasharray', '4, 4');
                }
            }

            // Legend (bottom-left)
            const legendRelTypes = [...new Set(positionedRels.map(r => r.relationshipType))];
            if (legendRelTypes.length > 0) {
                const legendX = -width / 2 + 20;
                const legendY = height / 2 - 24 - legendRelTypes.length * 18;

                const legend = g.append('g')
                    .attr('class', 'wm-legend')
                    .attr('transform', `translate(${legendX}, ${legendY})`);

                if (animate) {
                    legend.style('opacity', 0)
                        .transition().duration(enterDuration).delay(nodeDelay + 100).ease(enterEase)
                        .style('opacity', 1);
                }

                legend.append('rect')
                    .attr('class', 'wm-legend-bg')
                    .attr('x', -8)
                    .attr('y', -16)
                    .attr('width', 150)
                    .attr('height', legendRelTypes.length * 18 + 26);

                legend.append('text')
                    .attr('class', 'wm-legend-title')
                    .attr('y', -2)
                    .text('Relationships');

                legendRelTypes.forEach((type, i) => {
                    const item = legend.append('g')
                        .attr('class', 'wm-legend-item')
                        .attr('transform', `translate(0, ${14 + i * 18})`);

                    item.append('line')
                        .attr('x1', 0).attr('x2', 20)
                        .attr('y1', 0).attr('y2', 0)
                        .attr('class', `wm-link wm-link-${relTypeClass(type)}`)
                        .attr('stroke-width', 2);

                    item.append('text')
                        .attr('x', 26)
                        .attr('dy', '0.35em')
                        .text(relTypeLabel(type));
                });
            }

            // Collision resolution simulation
            // When animating, delay simulation start until entrance animations finish
            const simDelay = animate ? nodeDelay + enterDuration + 50 : 0;

            positionedRels.forEach(rel => {
                rel.x = rel._x;
                rel.y = rel._y;
                rel.targetX = rel._x;
                rel.targetY = rel._y;
                rel.targetRadius = rel._ringRadius;
                rel.nodeRadius = rel._nodeRadius;
            });

            let simulation = null;
            let stopTimeout = null;

            const startSimulation = () => {
                simulation = d3.forceSimulation(positionedRels)
                    .force('collision', d3.forceCollide()
                        .radius(d => d.nodeRadius + 6)
                        .strength(0.8)
                    )
                    .force('radial', d3.forceRadial(d => d.targetRadius, 0, 0).strength(0.3))
                    .force('x', d3.forceX(d => d.targetX).strength(0.1))
                    .force('y', d3.forceY(d => d.targetY).strength(0.1))
                    .alphaDecay(0.025)
                    .velocityDecay(0.35)
                    .on('tick', () => {
                        nodes.attr('transform', d => `translate(${d.x}, ${d.y})`);
                        links.attr('x2', d => d.x).attr('y2', d => d.y);
                    });

                stopTimeout = setTimeout(() => simulation.stop(), 3000);
            };

            const simStartTimeout = setTimeout(startSimulation, simDelay);

            state.cleanupAnimation = () => {
                clearTimeout(simStartTimeout);
                if (simulation) simulation.stop();
                if (stopTimeout) clearTimeout(stopTimeout);
            };
        }

        // =====================================================
        // DETAIL PANEL
        // =====================================================

        function showDetailPanel(entity) {
            const panel = dom.detailPanel;

            // Entity header with link to full research page
            const entityNameEl = document.getElementById('entity-name');
            entityNameEl.innerHTML = `<a href="/entity/${entity.id}" style="color: inherit; text-decoration: none;" title="View full research">${entity.name}</a>`;

            const logoEl = document.getElementById('entity-logo');
            if (entity.logoUrl || entity.logoSvgContent) {
                if (entity.logoSvgContent) {
                    logoEl.innerHTML = entity.logoSvgContent;
                } else {
                    logoEl.innerHTML = `<img src="${entity.logoUrl}" alt="${entity.name} logo" onerror="this.parentElement.innerHTML='<span class=\\'placeholder\\'>${entity.name.charAt(0)}</span>'">`;
                }
            } else {
                logoEl.innerHTML = `<span class="placeholder">${entity.name.charAt(0)}</span>`;
            }

            const urlEl = document.getElementById('entity-url');
            if (entity.url) {
                urlEl.href = entity.url;
                urlEl.querySelector('span').textContent = new URL(entity.url).hostname;
                urlEl.style.display = 'flex';
            } else {
                urlEl.style.display = 'none';
            }

            // Show full research link (restore if hidden by world model view)
            const fullResearchContainer = document.getElementById('panel-full-research');
            const fullResearchLink = document.getElementById('full-research-link');
            fullResearchLink.href = `/entity/${entity.id}`;
            fullResearchContainer.style.display = 'block';

            // Ensure panel stats are accessible for other functions
            const panelStatsEl = document.getElementById('panel-stats');
            panelStatsEl.style.display = '';

            // Stats
            const assertions = entity.assertions || [];
            const validated = assertions.filter(a => a.status === 'EVIDENCE').length;
            const pending = assertions.filter(a => a.status === 'CLAIM').length;

            // Restore original stat labels (may have been changed by world model view)
            const statsEl = document.getElementById('panel-stats');
            statsEl.innerHTML = `
                <div class="panel-stat">
                    <div class="value" id="stat-assertions">${assertions.length}</div>
                    <div class="label">Assertions</div>
                </div>
                <div class="panel-stat accent">
                    <div class="value" id="stat-validated">${validated}</div>
                    <div class="label">Validated</div>
                </div>
                <div class="panel-stat">
                    <div class="value" id="stat-pending">${pending}</div>
                    <div class="label">Pending</div>
                </div>
            `;

            // Assertions grouped by category
            const panelContent = document.getElementById('panel-content');

            // Build positioning section if world model data available
            let positioningHtml = '';
            if (state.worldModelData && state.worldModelData.positioning) {
                const pos = state.worldModelData.positioning;
                const dims = [];
                if (pos.primaryStage) dims.push({ label: 'Stage', value: pos.primaryStage });
                if (pos.solutionScope) dims.push({ label: 'Scope', value: pos.solutionScope });
                if (pos.maturityStage) dims.push({ label: 'Maturity', value: pos.maturityStage });
                if (pos.businessModel) dims.push({ label: 'Model', value: pos.businessModel });
                if (pos.adoptionCurve) dims.push({ label: 'Adoption', value: pos.adoptionCurve.replace(/_/g, ' ') });
                if (pos.primaryEcosystem) dims.push({ label: 'Ecosystem', value: pos.primaryEcosystem });

                if (dims.length > 0) {
                    positioningHtml = `<div class="wm-panel-section">
                        <div class="wm-section-title">Position</div>
                        <div class="wm-dimensions">
                            ${dims.map(d => `<div class="wm-dim"><span class="wm-dim-label">${d.label}</span><span class="wm-dim-value">${d.value}</span></div>`).join('')}
                        </div>
                    </div>`;
                }
            }

            if (assertions.length === 0) {
                panelContent.innerHTML = positioningHtml + `
                    <div class="empty-state" style="padding: var(--space-xl) 0;">
                        <p style="color: var(--text-tertiary);">No assertions yet</p>
                        <p style="font-size: 12px; color: var(--text-muted);">Run /research-entity to gather data</p>
                    </div>
                `;
            } else {
                // Group by category
                const grouped = {};
                for (const assertion of assertions) {
                    const cat = assertion.category || 'uncategorized';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(assertion);
                }

                let html = positioningHtml;

                html += '<div class="assertions-section">';
                html += `<div class="section-header">
                    <span class="section-title">Assertions</span>
                    <span class="section-count">${assertions.length}</span>
                </div>`;

                for (const [category, items] of Object.entries(grouped)) {
                    html += `<div class="assertion-group">
                        <div class="assertion-group-header">${category}</div>`;

                    for (const assertion of items) {
                        const statusClass = assertion.status.toLowerCase();
                        const criticalityClass = (assertion.criticality || 'medium').toLowerCase();

                        html += `
                            <div class="assertion-card">
                                <div class="assertion-header">
                                    <span class="assertion-status ${statusClass}"></span>
                                    <span class="assertion-claim">${assertion.claim}</span>
                                </div>
                                <div class="assertion-meta">
                                    <span class="assertion-badge badge-status ${statusClass}">${assertion.status}</span>
                                    <span class="assertion-badge badge-criticality ${criticalityClass}">${assertion.criticality || 'MEDIUM'}</span>
                                </div>
                                ${assertion.evidenceDescription ? `
                                    <div class="evidence-section">
                                        <div class="evidence-item">
                                            <svg class="evidence-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                                <polyline points="14 2 14 8 20 8"/>
                                            </svg>
                                            <span class="evidence-text">${assertion.evidenceDescription}</span>
                                        </div>
                                        ${assertion.evidenceScreenshotPath ? `
                                            <div class="evidence-screenshot">
                                                <img src="/${assertion.evidenceScreenshotPath}" alt="Evidence screenshot"
                                                     onerror="this.parentElement.style.display='none'">
                                            </div>
                                        ` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }

                    html += '</div>';
                }

                html += '</div>';
                panelContent.innerHTML = html;
            }

            panel.classList.add('open');
        }

        function closeDetailPanel() {
            dom.detailPanel.classList.remove('open');
            state.selectedEntity = null;
            // If closing from world model, return to category view
            if (state.currentLevel === 'worldmodel' && state.selectedCategory) {
                // Set level first to prevent re-entrant call
                state.currentLevel = 'category';
                // Cleanup animations and re-render category view
                if (state.cleanupAnimation) {
                    state.cleanupAnimation();
                    state.cleanupAnimation = null;
                }
                updateBreadcrumb();
                renderEntities(state.selectedCategory);
            }
        }

        // =====================================================
        // TOOLTIP
        // =====================================================

        function showTooltip(event, data, type) {
            const tooltip = dom.tooltip;

            if (type === 'category') {
                const count = data.children ? data.children.length : 0;
                const avgBuzz = data.avgBuzz ? Math.round(data.avgBuzz * 100) : 0;
                const weight = data.normalizedWeight ? Math.round(data.normalizedWeight * 100) : 0;
                tooltip.innerHTML = `
                    <div class="tooltip-title">
                        <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle; margin-right: 4px;">${data.materialIcon || 'category'}</span>
                        ${formatCategoryName(data.key)}
                    </div>
                    <div class="tooltip-meta">${count} entities</div>
                    <div class="tooltip-stats">
                        <span class="tooltip-stat"><span class="value">${avgBuzz}%</span> avg buzz</span>
                        <span class="tooltip-stat"><span class="value">${weight}%</span> weight</span>
                    </div>
                    <div class="tooltip-stats">
                        <span class="tooltip-stat">Click to explore</span>
                    </div>
                `;
            } else if (type === 'entity') {
                const validated = Math.round((data.evidenceRatio || 0) * 100);
                const buzzScore = data.buzzScore || 0;
                const buzzPercent = Math.round(buzzScore * 100);
                const buzzLabel = buzzScore > 0.7 ? 'High' : buzzScore > 0.4 ? 'Medium' : buzzScore > 0 ? 'Low' : 'N/A';
                tooltip.innerHTML = `
                    <div class="tooltip-title">${data.name}</div>
                    <div class="tooltip-meta">${data.entityType || 'Entity'}</div>
                    <div class="tooltip-stats">
                        <span class="tooltip-stat"><span class="value">${data.assertionCount || 0}</span> assertions</span>
                        <span class="tooltip-stat"><span class="value">${validated}%</span> validated</span>
                    </div>
                    ${buzzScore > 0 ? `
                    <div class="tooltip-buzz">
                        <span class="buzz-label">Buzz:</span>
                        <span class="buzz-value ${buzzLabel.toLowerCase()}">${buzzPercent}</span>
                        <span class="buzz-tier">${buzzLabel}</span>
                    </div>
                    ` : ''}
                `;
            } else if (type === 'worldmodel') {
                const name = data.relatedEntity ? data.relatedEntity.name : '?';
                const strengthPct = Math.round(data.strength * 100);
                tooltip.innerHTML = `
                    <div class="tooltip-title">${name}</div>
                    <div class="tooltip-meta" style="color: ${getRelColor(data.relationshipType)}">${relTypeLabel(data.relationshipType)}</div>
                    <div class="tooltip-stats">
                        <span class="tooltip-stat"><span class="value">${strengthPct}%</span> strength</span>
                    </div>
                    ${data.context ? `<div class="tooltip-meta" style="margin-top: 4px; font-size: 11px; max-width: 250px; white-space: normal; line-height: 1.4;">${data.context}</div>` : ''}
                    ${data.relatedEntity && data.relatedEntity.id ? '<div class="tooltip-stats"><span class="tooltip-stat">Click to view</span></div>' : ''}
                `;
            }

            const rect = event.target.getBoundingClientRect();
            tooltip.style.left = `${rect.right + 10}px`;
            tooltip.style.top = `${rect.top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            dom.tooltip.classList.remove('visible');
        }

        // =====================================================
        // UTILITIES
        // =====================================================

        function formatCategoryName(key) {
            if (!key) return 'Unknown';
            return key
                .replace(/_/g, ' ')
                .replace(/\bai\b/gi, 'AI')
                .replace(/\bgenai\b/gi, 'GenAI')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (state.currentLevel === 'project') {
                    renderCategories();
                } else if (state.currentLevel === 'category' && state.selectedCategory) {
                    renderEntities(state.selectedCategory);
                } else if (state.currentLevel === 'worldmodel' && state.worldModelData) {
                    renderWorldModel(state.worldModelData);
                }
            }, 250);
        });

        // Initialize
        init();
    </script>
</body>
</html>
