<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Research | Deep Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Entity Page Specific Styles */
        .entity-page {
            min-height: 100vh;
            background: var(--bg-primary);
        }

        .entity-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            padding: var(--space-md) var(--space-lg);
        }

        .entity-header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .entity-breadcrumb {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 0.875rem;
        }

        .breadcrumb-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .breadcrumb-link:hover {
            color: var(--text-primary);
        }

        .breadcrumb-sep {
            color: var(--text-muted);
        }

        .breadcrumb-current {
            color: var(--text-primary);
            font-weight: 500;
        }

        .entity-hero {
            background: var(--bg-secondary);
            padding: var(--space-xl) var(--space-lg);
            border-bottom: 1px solid var(--border-light);
        }

        .entity-hero-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: var(--space-xl);
        }

        .entity-hero-logo {
            width: 80px;
            height: 80px;
            background: var(--bg-primary);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .entity-hero-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .entity-hero-logo svg {
            max-width: 60px;
            max-height: 60px;
        }

        .entity-hero-logo .placeholder {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-tertiary);
        }

        .entity-hero-info {
            flex: 1;
        }

        .entity-hero-name {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 var(--space-sm);
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .entity-type-badge {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--space-sm);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .entity-hero-url {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--text-tertiary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            margin-bottom: var(--space-md);
        }

        .entity-hero-url:hover {
            color: var(--status-in-progress);
            text-decoration: underline;
        }

        .entity-hero-description {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
        }

        .entity-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--space-md);
            margin-top: var(--space-lg);
        }

        .entity-stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: var(--space-md);
            text-align: center;
        }

        .entity-stat-card.accent {
            border-color: var(--status-validated);
            background: var(--status-validated-bg);
        }

        .entity-stat-value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .entity-stat-card.accent .entity-stat-value {
            color: var(--status-validated);
        }

        .entity-stat-label {
            font-size: 0.6875rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: var(--space-xs);
        }

        /* Tabs */
        .entity-tabs-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
        }

        .entity-tabs {
            display: flex;
            gap: var(--space-xs);
            border-bottom: 1px solid var(--border-light);
            padding-top: var(--space-md);
            overflow-x: auto;
        }

        .entity-tab {
            padding: var(--space-sm) var(--space-lg);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition-fast);
        }

        .entity-tab:hover {
            color: var(--text-primary);
            background: var(--bg-secondary);
        }

        .entity-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--text-primary);
        }

        .entity-tab-badge {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: var(--space-xs);
        }

        .tab-panel {
            padding: var(--space-xl) 0;
        }

        .tab-panel[x-show="false"] {
            display: none;
        }

        /* Overview Tab */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--space-xl);
        }

        .overview-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: var(--space-lg);
        }

        .overview-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-md);
        }

        .overview-card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .github-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
        }

        .github-stat {
            display: flex;
            flex-direction: column;
        }

        .github-stat-value {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .github-stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .buzz-score-display {
            text-align: center;
            padding: var(--space-lg);
        }

        .buzz-score-value {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 700;
            color: var(--status-validated);
        }

        .buzz-score-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: var(--space-sm);
        }

        .buzz-components {
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-light);
        }

        .buzz-component {
            display: flex;
            justify-content: space-between;
            padding: var(--space-xs) 0;
            font-size: 0.8125rem;
        }

        .buzz-component-name {
            color: var(--text-secondary);
        }

        .buzz-component-value {
            font-family: var(--font-mono);
            color: var(--text-primary);
        }

        /* Extractions Tab */
        .extractions-grid {
            display: grid;
            gap: var(--space-lg);
        }

        .extraction-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            overflow: hidden;
        }

        .extraction-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-light);
        }

        .extraction-type {
            font-weight: 600;
            color: var(--text-primary);
            text-transform: capitalize;
        }

        .extraction-meta {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .extraction-card-content {
            padding: var(--space-lg);
        }

        .extraction-data {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            background: var(--bg-primary);
            padding: var(--space-md);
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-secondary);
            max-height: 400px;
            overflow-y: auto;
        }

        .extraction-source {
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-light);
            font-size: 0.8125rem;
        }

        .extraction-source-label {
            color: var(--text-tertiary);
        }

        .extraction-source-url {
            color: var(--status-in-progress);
            text-decoration: none;
            word-break: break-all;
        }

        .extraction-source-url:hover {
            text-decoration: underline;
        }

        /* Pricing extraction specific */
        .pricing-tiers {
            display: grid;
            gap: var(--space-md);
        }

        .pricing-tier {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: var(--space-md);
        }

        .pricing-tier-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
        }

        .pricing-tier-price {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--status-validated);
        }

        .pricing-tier-cycle {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }

        .pricing-tier-features {
            margin-top: var(--space-sm);
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        /* Assertions Tab */
        .assertions-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .assertion-full-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: var(--space-lg);
        }

        .assertion-full-card.validated {
            border-left: 3px solid var(--status-validated);
        }

        .assertion-full-card.pending {
            border-left: 3px solid var(--status-pending);
        }

        .assertion-full-card.rejected {
            border-left: 3px solid var(--status-rejected);
        }

        .assertion-full-header {
            display: flex;
            align-items: flex-start;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .assertion-full-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .assertion-full-status.EVIDENCE { background: var(--status-validated); }
        .assertion-full-status.CLAIM { background: var(--status-pending); }
        .assertion-full-status.REJECTED { background: var(--status-rejected); }

        .assertion-full-claim {
            flex: 1;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .assertion-full-badges {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .assertion-badge {
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-category {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .badge-criticality.CRITICAL { background: rgba(220, 50, 47, 0.15); color: var(--criticality-critical); }
        .badge-criticality.HIGH { background: rgba(203, 75, 22, 0.15); color: var(--criticality-high); }
        .badge-criticality.MEDIUM { background: rgba(38, 139, 210, 0.15); color: var(--criticality-medium); }
        .badge-criticality.LOW { background: var(--bg-tertiary); color: var(--criticality-low); }

        .badge-status.EVIDENCE { background: var(--status-validated-bg); color: var(--status-validated); }
        .badge-status.CLAIM { background: rgba(181, 137, 0, 0.15); color: var(--status-pending); }
        .badge-status.REJECTED { background: var(--status-rejected-bg); color: var(--status-rejected); }

        .assertion-full-evidence {
            margin-top: var(--space-md);
            padding: var(--space-md);
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .evidence-label {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--status-validated);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-sm);
        }

        .evidence-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .evidence-screenshot-thumb {
            margin-top: var(--space-sm);
            max-width: 300px;
            border-radius: 6px;
            border: 2px solid var(--border-light);
            cursor: zoom-in;
            transition: all var(--transition-fast);
            position: relative;
        }

        .evidence-screenshot-thumb:hover {
            transform: scale(1.02);
            border-color: var(--status-in-progress);
            box-shadow: 0 4px 12px rgba(38, 139, 210, 0.2);
        }

        .assertion-full-sources {
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-light);
        }

        .sources-label {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-sm);
        }

        .source-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-sm);
            padding: var(--space-sm) 0;
            border-bottom: 1px solid var(--border-light);
        }

        .source-item:last-child {
            border-bottom: none;
        }

        .source-grade-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .source-grade-dot.DIRECT_EVIDENCE { background: var(--status-validated); }
        .source-grade-dot.STRONG_SUPPORT { background: #2aa198; }
        .source-grade-dot.PARTIAL_SUPPORT { background: var(--status-pending); }
        .source-grade-dot.WEAK_SUPPORT { background: #cb4b16; }
        .source-grade-dot.NOT_RELEVANT { background: var(--text-muted); }
        .source-grade-dot.MISLEADING { background: var(--status-rejected); }
        .source-grade-dot.ungraded { background: transparent; border: 1.5px solid var(--border-medium); }

        .source-content {
            flex: 1;
        }

        .source-url-link {
            font-size: 0.8125rem;
            color: var(--status-in-progress);
            text-decoration: none;
            word-break: break-all;
        }

        .source-url-link:hover {
            text-decoration: underline;
        }

        .source-quote {
            font-size: 0.8125rem;
            font-style: italic;
            color: var(--text-secondary);
            margin-top: var(--space-xs);
            padding-left: var(--space-sm);
            border-left: 2px solid var(--border-light);
        }

        .source-grade-badge {
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: var(--space-xs);
            display: inline-block;
        }

        /* Evidence Tab */
        .evidence-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: var(--space-md);
        }

        .evidence-gallery-item {
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            border-radius: 8px;
            overflow: hidden;
            cursor: zoom-in;
            transition: all var(--transition-fast);
        }

        .evidence-gallery-item:hover {
            border-color: var(--status-in-progress);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(38, 139, 210, 0.15);
        }

        .evidence-gallery-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .evidence-gallery-caption {
            padding: var(--space-sm) var(--space-md);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
        }

        /* History Tab */
        .session-timeline {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .session-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: var(--space-lg);
        }

        .session-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-md);
        }

        .session-date {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--text-tertiary);
        }

        .session-status-badge {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .session-status-badge.COMPLETED {
            background: var(--status-validated-bg);
            color: var(--status-validated);
        }

        .session-status-badge.RESEARCHING {
            background: rgba(38, 139, 210, 0.15);
            color: var(--status-in-progress);
        }

        .session-status-badge.FAILED {
            background: var(--status-rejected-bg);
            color: var(--status-rejected);
        }

        .session-stats {
            display: flex;
            gap: var(--space-lg);
        }

        .session-stat {
            display: flex;
            flex-direction: column;
        }

        .session-stat-value {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .session-stat-label {
            font-size: 0.6875rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        .session-tasks {
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-light);
        }

        .session-task {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-xs) 0;
            font-size: 0.8125rem;
        }

        .session-task-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.625rem;
        }

        .session-task-icon.COMPLETED {
            background: var(--status-validated-bg);
            color: var(--status-validated);
        }

        .session-task-icon.IN_PROGRESS {
            background: rgba(38, 139, 210, 0.15);
            color: var(--status-in-progress);
        }

        .session-task-icon.PENDING {
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .session-task-icon.FAILED {
            background: var(--status-rejected-bg);
            color: var(--status-rejected);
        }

        /* Empty states */
        .empty-tab {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-tertiary);
        }

        .empty-tab-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-lg);
            opacity: 0.4;
        }

        .empty-tab-title {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
        }

        /* Lightbox - Enhanced for long screenshots */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding: var(--space-xl);
            cursor: zoom-out;
        }

        .lightbox-content {
            position: relative;
            max-width: 95vw;
            margin: auto;
        }

        .lightbox img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: default;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: fixed;
            top: var(--space-lg);
            right: var(--space-lg);
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all var(--transition-fast);
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .lightbox-hint {
            position: fixed;
            bottom: var(--space-lg);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8125rem;
            z-index: 1001;
        }

        /* Features extraction styling */
        .features-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .feature-category {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: var(--space-md);
        }

        .feature-category-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
            font-size: 0.9375rem;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .feature-item {
            display: flex;
            gap: var(--space-sm);
            padding: var(--space-xs) 0;
        }

        .feature-item.highlight {
            background: rgba(133, 153, 0, 0.1);
            padding: var(--space-xs) var(--space-sm);
            border-radius: 4px;
            margin: 0 calc(-1 * var(--space-sm));
        }

        .feature-name {
            font-weight: 500;
            color: var(--text-primary);
            min-width: 120px;
        }

        .feature-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Company extraction styling */
        .company-grid {
            display: grid;
            gap: var(--space-md);
        }

        .company-section {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: var(--space-md);
        }

        .company-section-title {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-sm);
        }

        .company-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .company-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            margin-top: var(--space-sm);
        }

        .company-meta-item {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .company-meta-item strong {
            color: var(--text-primary);
        }

        .founder-card {
            padding: var(--space-sm) 0;
            border-bottom: 1px solid var(--border-light);
        }

        .founder-card:last-child {
            border-bottom: none;
        }

        .founder-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .founder-role {
            font-size: 0.8125rem;
            color: var(--status-validated);
        }

        .founder-bg {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-top: var(--space-xs);
        }

        .milestone-list {
            list-style: none;
            padding: 0;
        }

        .milestone-list li {
            padding: var(--space-xs) 0;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            border-left: 2px solid var(--border-light);
            padding-left: var(--space-sm);
            margin-left: var(--space-xs);
        }

        /* Compliance extraction styling */
        .compliance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-md);
        }

        .compliance-badge {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: var(--space-md);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .compliance-badge.active {
            border-left: 3px solid var(--status-validated);
        }

        .compliance-badge.inactive {
            opacity: 0.5;
        }

        .compliance-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .compliance-icon.check {
            background: var(--status-validated-bg);
            color: var(--status-validated);
        }

        .compliance-icon.x {
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .compliance-info {
            flex: 1;
        }

        .compliance-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .compliance-detail {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .compliance-section {
            grid-column: 1 / -1;
            background: var(--bg-primary);
            border-radius: 8px;
            padding: var(--space-md);
        }

        .compliance-section-title {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-sm);
        }

        .security-features-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
        }

        .security-feature-tag {
            background: var(--bg-secondary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Integrations extraction styling */
        .integrations-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .integration-section {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: var(--space-md);
        }

        .integration-section-title {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-sm);
        }

        .integration-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
        }

        .integration-tag {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8125rem;
        }

        .integration-tag .name {
            color: var(--text-primary);
            font-weight: 500;
        }

        .integration-tag .type {
            color: var(--text-tertiary);
            font-size: 0.6875rem;
            margin-left: var(--space-xs);
        }

        /* Loading */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: var(--space-md);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-light);
            border-top-color: var(--status-validated);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .entity-hero-inner {
                flex-direction: column;
                gap: var(--space-md);
            }

            .entity-hero-name {
                font-size: 1.5rem;
                flex-wrap: wrap;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .entity-tabs {
                padding: var(--space-sm) 0;
            }

            .entity-tab {
                padding: var(--space-sm) var(--space-md);
            }
        }
    </style>
</head>
<body>
    <div class="entity-page" x-data="entityPage()" x-init="init()">
        <!-- Header with breadcrumb -->
        <header class="entity-header">
            <div class="entity-header-inner">
                <nav class="entity-breadcrumb">
                    <a href="/" class="breadcrumb-link">Grove</a>
                    <span class="breadcrumb-sep">/</span>
                    <a :href="'/?project=' + entity?.project?.id" class="breadcrumb-link" x-text="entity?.project?.name || 'Project'"></a>
                    <span class="breadcrumb-sep">/</span>
                    <template x-if="entity?.discoveryCategory">
                        <span>
                            <span class="breadcrumb-link" x-text="formatCategory(entity.discoveryCategory)"></span>
                            <span class="breadcrumb-sep">/</span>
                        </span>
                    </template>
                    <span class="breadcrumb-current" x-text="entity?.name || 'Entity'"></span>
                </nav>
            </div>
        </header>

        <!-- Loading state -->
        <template x-if="loading">
            <div class="loading-container">
                <div class="spinner"></div>
                <p>Loading entity data...</p>
            </div>
        </template>

        <!-- Error state -->
        <template x-if="error">
            <div class="empty-tab">
                <div class="empty-tab-title">Error loading entity</div>
                <p x-text="error"></p>
                <a href="/" style="color: var(--status-in-progress);">Return to Grove</a>
            </div>
        </template>

        <!-- Main content -->
        <template x-if="!loading && !error && entity">
            <div>
                <!-- Hero section -->
                <section class="entity-hero">
                    <div class="entity-hero-inner">
                        <div class="entity-hero-logo">
                            <template x-if="entity.logoSvgContent">
                                <div x-html="entity.logoSvgContent"></div>
                            </template>
                            <template x-if="!entity.logoSvgContent && entity.logoUrl">
                                <img :src="entity.logoUrl" :alt="entity.name + ' logo'">
                            </template>
                            <template x-if="!entity.logoSvgContent && !entity.logoUrl">
                                <span class="placeholder" x-text="entity.name.charAt(0)"></span>
                            </template>
                        </div>
                        <div class="entity-hero-info">
                            <h1 class="entity-hero-name">
                                <span x-text="entity.name"></span>
                                <span class="entity-type-badge" x-text="entity.entityType || 'entity'" x-show="entity.entityType"></span>
                            </h1>
                            <a :href="entity.url" target="_blank" class="entity-hero-url" x-show="entity.url">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                    <polyline points="15 3 21 3 21 9"/>
                                    <line x1="10" y1="14" x2="21" y2="3"/>
                                </svg>
                                <span x-text="formatUrl(entity.url)"></span>
                            </a>
                            <p class="entity-hero-description" x-text="entity.description" x-show="entity.description"></p>

                            <div class="entity-stats-grid">
                                <div class="entity-stat-card">
                                    <div class="entity-stat-value" x-text="stats.totalAssertions"></div>
                                    <div class="entity-stat-label">Assertions</div>
                                </div>
                                <div class="entity-stat-card accent">
                                    <div class="entity-stat-value" x-text="stats.validationRate + '%'"></div>
                                    <div class="entity-stat-label">Validated</div>
                                </div>
                                <div class="entity-stat-card">
                                    <div class="entity-stat-value" x-text="stats.totalExtractions"></div>
                                    <div class="entity-stat-label">Extractions</div>
                                </div>
                                <div class="entity-stat-card">
                                    <div class="entity-stat-value" x-text="stats.evidenceCount"></div>
                                    <div class="entity-stat-label">Evidence</div>
                                </div>
                                <template x-if="entity.buzz">
                                    <div class="entity-stat-card">
                                        <div class="entity-stat-value" x-text="(entity.buzz.score * 100).toFixed(0)"></div>
                                        <div class="entity-stat-label">Buzz Score</div>
                                    </div>
                                </template>
                                <template x-if="entity.github">
                                    <div class="entity-stat-card">
                                        <div class="entity-stat-value" x-text="formatNumber(entity.github.stars)"></div>
                                        <div class="entity-stat-label">GitHub Stars</div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Tabs -->
                <div class="entity-tabs-container">
                    <div class="entity-tabs">
                        <button class="entity-tab" :class="{ active: activeTab === 'overview' }" @click="activeTab = 'overview'">
                            Overview
                        </button>
                        <button class="entity-tab" :class="{ active: activeTab === 'extractions' }" @click="activeTab = 'extractions'">
                            Extractions
                            <span class="entity-tab-badge" x-text="stats.totalExtractions"></span>
                        </button>
                        <button class="entity-tab" :class="{ active: activeTab === 'assertions' }" @click="activeTab = 'assertions'">
                            Assertions
                            <span class="entity-tab-badge" x-text="stats.totalAssertions"></span>
                        </button>
                        <button class="entity-tab" :class="{ active: activeTab === 'evidence' }" @click="activeTab = 'evidence'">
                            Evidence
                            <span class="entity-tab-badge" x-text="stats.evidenceCount"></span>
                        </button>
                        <button class="entity-tab" :class="{ active: activeTab === 'history' }" @click="activeTab = 'history'">
                            History
                            <span class="entity-tab-badge" x-text="stats.sessionsCount"></span>
                        </button>
                    </div>

                    <!-- Overview Tab -->
                    <div class="tab-panel" x-show="activeTab === 'overview'">
                        <div class="overview-grid">
                            <!-- GitHub Card -->
                            <template x-if="entity.github">
                                <div class="overview-card">
                                    <div class="overview-card-header">
                                        <span class="overview-card-title">GitHub Metrics</span>
                                        <a :href="entity.github.url" target="_blank" style="color: var(--status-in-progress); font-size: 0.8125rem;">View Repo</a>
                                    </div>
                                    <div class="github-stats-grid">
                                        <div class="github-stat">
                                            <span class="github-stat-value" x-text="formatNumber(entity.github.stars)"></span>
                                            <span class="github-stat-label">Stars</span>
                                        </div>
                                        <div class="github-stat">
                                            <span class="github-stat-value" x-text="formatNumber(entity.github.forks)"></span>
                                            <span class="github-stat-label">Forks</span>
                                        </div>
                                        <div class="github-stat">
                                            <span class="github-stat-value" x-text="formatNumber(entity.github.watchers)"></span>
                                            <span class="github-stat-label">Watchers</span>
                                        </div>
                                        <div class="github-stat">
                                            <span class="github-stat-value" x-text="formatNumber(entity.github.openIssues)"></span>
                                            <span class="github-stat-label">Open Issues</span>
                                        </div>
                                        <div class="github-stat" x-show="entity.github.contributors">
                                            <span class="github-stat-value" x-text="formatNumber(entity.github.contributors)"></span>
                                            <span class="github-stat-label">Contributors</span>
                                        </div>
                                        <div class="github-stat" x-show="entity.github.language">
                                            <span class="github-stat-value" x-text="entity.github.language"></span>
                                            <span class="github-stat-label">Language</span>
                                        </div>
                                    </div>
                                    <div style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--border-light); font-size: 0.8125rem; color: var(--text-tertiary);">
                                        <template x-if="entity.github.lastCommit">
                                            <div>Last commit: <span x-text="formatDate(entity.github.lastCommit)"></span></div>
                                        </template>
                                        <template x-if="entity.github.license">
                                            <div>License: <span x-text="entity.github.license"></span></div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Buzz Score Card -->
                            <template x-if="entity.buzz">
                                <div class="overview-card">
                                    <div class="overview-card-header">
                                        <span class="overview-card-title">Buzz Score</span>
                                    </div>
                                    <div class="buzz-score-display">
                                        <div class="buzz-score-value" x-text="(entity.buzz.score * 100).toFixed(0)"></div>
                                        <div class="buzz-score-label">Composite Market Score</div>
                                    </div>
                                    <template x-if="entity.buzz.components">
                                        <div class="buzz-components">
                                            <template x-for="(value, key) in entity.buzz.components" :key="key">
                                                <div class="buzz-component">
                                                    <span class="buzz-component-name" x-text="formatBuzzComponent(key)"></span>
                                                    <span class="buzz-component-value" x-text="typeof value === 'number' ? (value * 100).toFixed(0) : value"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Category/Domain Card -->
                            <div class="overview-card">
                                <div class="overview-card-header">
                                    <span class="overview-card-title">Classification</span>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: var(--space-md);">
                                    <div x-show="entity.discoveryCategory">
                                        <div style="font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: var(--space-xs);">Discovery Category</div>
                                        <div style="font-weight: 500; color: var(--text-primary);" x-text="formatCategory(entity.discoveryCategory)"></div>
                                    </div>
                                    <div x-show="entity.category">
                                        <div style="font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: var(--space-xs);">LLM Category</div>
                                        <div style="font-weight: 500; color: var(--text-primary);" x-text="entity.category?.displayName"></div>
                                    </div>
                                    <div x-show="entity.domain">
                                        <div style="font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: var(--space-xs);">Research Domain</div>
                                        <div style="font-weight: 500; color: var(--text-primary);" x-text="entity.domain?.name"></div>
                                        <div style="font-size: 0.8125rem; color: var(--text-secondary); margin-top: var(--space-xs);" x-text="entity.domain?.description"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Criticality Breakdown -->
                            <div class="overview-card">
                                <div class="overview-card-header">
                                    <span class="overview-card-title">Assertion Criticality</span>
                                </div>
                                <div class="github-stats-grid">
                                    <div class="github-stat">
                                        <span class="github-stat-value" style="color: var(--criticality-critical);" x-text="stats.criticalityBreakdown?.critical || 0"></span>
                                        <span class="github-stat-label">Critical</span>
                                    </div>
                                    <div class="github-stat">
                                        <span class="github-stat-value" style="color: var(--criticality-high);" x-text="stats.criticalityBreakdown?.high || 0"></span>
                                        <span class="github-stat-label">High</span>
                                    </div>
                                    <div class="github-stat">
                                        <span class="github-stat-value" style="color: var(--criticality-medium);" x-text="stats.criticalityBreakdown?.medium || 0"></span>
                                        <span class="github-stat-label">Medium</span>
                                    </div>
                                    <div class="github-stat">
                                        <span class="github-stat-value" style="color: var(--criticality-low);" x-text="stats.criticalityBreakdown?.low || 0"></span>
                                        <span class="github-stat-label">Low</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Extractions Tab -->
                    <div class="tab-panel" x-show="activeTab === 'extractions'">
                        <template x-if="Object.keys(extractionsByType).length === 0">
                            <div class="empty-tab">
                                <svg class="empty-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                                </svg>
                                <div class="empty-tab-title">No extractions yet</div>
                                <p>Run extract commands to populate structured data</p>
                            </div>
                        </template>
                        <div class="extractions-grid">
                            <template x-for="(extraction, type) in extractionsByType" :key="type">
                                <div class="extraction-card">
                                    <div class="extraction-card-header">
                                        <span class="extraction-type" x-text="type"></span>
                                        <span class="extraction-meta" x-text="formatDate(extraction.extractedAt)"></span>
                                    </div>
                                    <div class="extraction-card-content">
                                        <!-- Pricing rendering -->
                                        <template x-if="type === 'pricing' && extraction.data?.tiers">
                                            <div class="pricing-tiers">
                                                <template x-for="tier in extraction.data.tiers" :key="tier.name">
                                                    <div class="pricing-tier">
                                                        <div class="pricing-tier-name" x-text="tier.name"></div>
                                                        <div>
                                                            <span class="pricing-tier-price" x-text="tier.price === 0 ? 'Free' : '$' + tier.price"></span>
                                                            <span class="pricing-tier-cycle" x-text="tier.billingCycle ? '/' + tier.billingCycle : ''"></span>
                                                        </div>
                                                        <div class="pricing-tier-features" x-show="tier.features">
                                                            <template x-for="feature in tier.features?.slice(0, 3)" :key="feature">
                                                                <div x-text="'• ' + feature"></div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- Features rendering -->
                                        <template x-if="type === 'features' && extraction.data?.categories">
                                            <div class="features-grid">
                                                <template x-for="category in extraction.data.categories" :key="category.name">
                                                    <div class="feature-category">
                                                        <div class="feature-category-name" x-text="category.name"></div>
                                                        <div class="feature-list">
                                                            <template x-for="feature in category.features" :key="feature.name">
                                                                <div class="feature-item" :class="{ highlight: feature.isHighlight }">
                                                                    <span class="feature-name" x-text="feature.name"></span>
                                                                    <span class="feature-desc" x-text="feature.description"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- Company rendering -->
                                        <template x-if="type === 'company' && extraction.data">
                                            <div class="company-grid">
                                                <div class="company-section">
                                                    <div class="company-name" x-text="extraction.data.name || entity.name"></div>
                                                    <div class="company-meta">
                                                        <span class="company-meta-item" x-show="extraction.data.founded"><strong>Founded:</strong> <span x-text="extraction.data.founded"></span></span>
                                                        <span class="company-meta-item" x-show="extraction.data.headquarters"><strong>HQ:</strong> <span x-text="extraction.data.headquarters"></span></span>
                                                        <span class="company-meta-item" x-show="extraction.data.employeeCount"><strong>Employees:</strong> <span x-text="extraction.data.employeeCount"></span></span>
                                                        <span class="company-meta-item" x-show="extraction.data.totalFunding"><strong>Funding:</strong> <span x-text="extraction.data.totalFunding"></span></span>
                                                    </div>
                                                    <p style="margin-top: var(--space-sm); font-size: 0.875rem; color: var(--text-secondary);" x-text="extraction.data.mission" x-show="extraction.data.mission"></p>
                                                </div>
                                                <template x-if="extraction.data.founders?.length">
                                                    <div class="company-section">
                                                        <div class="company-section-title">Founders</div>
                                                        <template x-for="founder in extraction.data.founders" :key="founder.name">
                                                            <div class="founder-card">
                                                                <div class="founder-name" x-text="founder.name"></div>
                                                                <div class="founder-role" x-text="founder.role"></div>
                                                                <div class="founder-bg" x-text="founder.background" x-show="founder.background"></div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="extraction.data.milestones?.length">
                                                    <div class="company-section">
                                                        <div class="company-section-title">Milestones</div>
                                                        <ul class="milestone-list">
                                                            <template x-for="milestone in extraction.data.milestones" :key="milestone">
                                                                <li x-text="milestone"></li>
                                                            </template>
                                                        </ul>
                                                    </div>
                                                </template>
                                                <template x-if="extraction.data.keyInvestors?.length">
                                                    <div class="company-section">
                                                        <div class="company-section-title">Key Investors</div>
                                                        <div style="font-size: 0.875rem; color: var(--text-secondary);" x-text="extraction.data.keyInvestors.join(', ')"></div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- Compliance rendering -->
                                        <template x-if="type === 'compliance' && extraction.data">
                                            <div class="compliance-grid">
                                                <div class="compliance-badge" :class="extraction.data.soc2 ? 'active' : 'inactive'">
                                                    <div class="compliance-icon" :class="extraction.data.soc2 ? 'check' : 'x'" x-text="extraction.data.soc2 ? '✓' : '✗'"></div>
                                                    <div class="compliance-info">
                                                        <div class="compliance-name">SOC 2</div>
                                                        <div class="compliance-detail" x-text="extraction.data.soc2Type || (extraction.data.soc2 ? 'Certified' : 'Not certified')"></div>
                                                    </div>
                                                </div>
                                                <div class="compliance-badge" :class="extraction.data.hipaa ? 'active' : 'inactive'">
                                                    <div class="compliance-icon" :class="extraction.data.hipaa ? 'check' : 'x'" x-text="extraction.data.hipaa ? '✓' : '✗'"></div>
                                                    <div class="compliance-info">
                                                        <div class="compliance-name">HIPAA</div>
                                                        <div class="compliance-detail" x-text="extraction.data.hipaa ? 'Compliant' : 'Not compliant'"></div>
                                                    </div>
                                                </div>
                                                <div class="compliance-badge" :class="extraction.data.gdpr ? 'active' : 'inactive'">
                                                    <div class="compliance-icon" :class="extraction.data.gdpr ? 'check' : 'x'" x-text="extraction.data.gdpr ? '✓' : '✗'"></div>
                                                    <div class="compliance-info">
                                                        <div class="compliance-name">GDPR</div>
                                                        <div class="compliance-detail" x-text="extraction.data.gdpr ? 'Compliant' : 'Not compliant'"></div>
                                                    </div>
                                                </div>
                                                <div class="compliance-badge" :class="extraction.data.fedRampStatus === 'Authorized' ? 'active' : 'inactive'">
                                                    <div class="compliance-icon" :class="extraction.data.fedRampStatus === 'Authorized' ? 'check' : 'x'" x-text="extraction.data.fedRampStatus === 'Authorized' ? '✓' : '✗'"></div>
                                                    <div class="compliance-info">
                                                        <div class="compliance-name">FedRAMP</div>
                                                        <div class="compliance-detail" x-text="extraction.data.fedRampStatus + (extraction.data.fedRampLevel ? ' (' + extraction.data.fedRampLevel + ')' : '')"></div>
                                                    </div>
                                                </div>
                                                <div class="compliance-badge" :class="extraction.data.iso27001 ? 'active' : 'inactive'">
                                                    <div class="compliance-icon" :class="extraction.data.iso27001 ? 'check' : 'x'" x-text="extraction.data.iso27001 ? '✓' : '✗'"></div>
                                                    <div class="compliance-info">
                                                        <div class="compliance-name">ISO 27001</div>
                                                        <div class="compliance-detail" x-text="extraction.data.iso27001 ? 'Certified' : 'Not certified'"></div>
                                                    </div>
                                                </div>
                                                <div class="compliance-badge" :class="extraction.data.sso ? 'active' : 'inactive'">
                                                    <div class="compliance-icon" :class="extraction.data.sso ? 'check' : 'x'" x-text="extraction.data.sso ? '✓' : '✗'"></div>
                                                    <div class="compliance-info">
                                                        <div class="compliance-name">SSO</div>
                                                        <div class="compliance-detail" x-text="extraction.data.ssoProviders?.slice(0,2).join(', ') || (extraction.data.sso ? 'Supported' : 'Not supported')"></div>
                                                    </div>
                                                </div>
                                                <template x-if="extraction.data.securityFeatures?.length">
                                                    <div class="compliance-section">
                                                        <div class="compliance-section-title">Security Features</div>
                                                        <div class="security-features-list">
                                                            <template x-for="feature in extraction.data.securityFeatures.slice(0, 8)" :key="feature">
                                                                <span class="security-feature-tag" x-text="feature"></span>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                                <template x-if="extraction.data.deploymentModels?.length">
                                                    <div class="compliance-section">
                                                        <div class="compliance-section-title">Deployment Options</div>
                                                        <div class="security-features-list">
                                                            <template x-for="model in extraction.data.deploymentModels" :key="model">
                                                                <span class="security-feature-tag" x-text="model"></span>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- Integrations rendering -->
                                        <template x-if="type === 'integrations' && extraction.data">
                                            <div class="integrations-grid">
                                                <template x-if="extraction.data.nativeIntegrations?.length">
                                                    <div class="integration-section">
                                                        <div class="integration-section-title">Native Integrations</div>
                                                        <div class="integration-tags">
                                                            <template x-for="integration in extraction.data.nativeIntegrations" :key="integration.name">
                                                                <div class="integration-tag">
                                                                    <span class="name" x-text="integration.name"></span>
                                                                    <span class="type" x-text="integration.type?.replace(/_/g, ' ')"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                                <template x-if="extraction.data.devToolIntegrations?.length">
                                                    <div class="integration-section">
                                                        <div class="integration-section-title">Dev Tool Integrations</div>
                                                        <div class="integration-tags">
                                                            <template x-for="integration in extraction.data.devToolIntegrations" :key="integration.name">
                                                                <div class="integration-tag">
                                                                    <span class="name" x-text="integration.name"></span>
                                                                    <span class="type" x-text="integration.type?.replace(/_/g, ' ')"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                                <template x-if="extraction.data.apiProtocols?.length">
                                                    <div class="integration-section">
                                                        <div class="integration-section-title">API Protocols</div>
                                                        <div class="integration-tags">
                                                            <template x-for="protocol in extraction.data.apiProtocols" :key="protocol">
                                                                <div class="integration-tag">
                                                                    <span class="name" x-text="protocol"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                                <template x-if="extraction.data.notes">
                                                    <div class="integration-section">
                                                        <div class="integration-section-title">Notes</div>
                                                        <p style="font-size: 0.875rem; color: var(--text-secondary);" x-text="extraction.data.notes"></p>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- Default JSON rendering for unknown types -->
                                        <template x-if="!['pricing', 'features', 'company', 'compliance', 'integrations'].includes(type) ||
                                                        (type === 'pricing' && !extraction.data?.tiers) ||
                                                        (type === 'features' && !extraction.data?.categories) ||
                                                        (type === 'company' && !extraction.data) ||
                                                        (type === 'compliance' && !extraction.data) ||
                                                        (type === 'integrations' && !extraction.data)">
                                            <pre class="extraction-data" x-text="JSON.stringify(extraction.data, null, 2)"></pre>
                                        </template>

                                        <div class="extraction-source" x-show="extraction.source?.url">
                                            <span class="extraction-source-label">Source: </span>
                                            <a :href="extraction.source?.url" target="_blank" class="extraction-source-url" x-text="extraction.source?.url"></a>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Assertions Tab -->
                    <div class="tab-panel" x-show="activeTab === 'assertions'">
                        <template x-if="assertions.length === 0">
                            <div class="empty-tab">
                                <svg class="empty-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <div class="empty-tab-title">No assertions yet</div>
                                <p>Research this entity to gather claims</p>
                            </div>
                        </template>
                        <div class="assertions-list">
                            <template x-for="assertion in assertions" :key="assertion.id">
                                <div class="assertion-full-card" :class="assertion.status.toLowerCase()">
                                    <div class="assertion-full-header">
                                        <div class="assertion-full-status" :class="assertion.status"></div>
                                        <div class="assertion-full-claim" x-text="assertion.claim"></div>
                                        <div class="assertion-full-badges">
                                            <span class="assertion-badge badge-category" x-text="assertion.category || 'general'" x-show="assertion.category"></span>
                                            <span class="assertion-badge badge-criticality" :class="assertion.criticality" x-text="assertion.criticality"></span>
                                            <span class="assertion-badge badge-status" :class="assertion.status" x-text="assertion.status"></span>
                                        </div>
                                    </div>

                                    <!-- Evidence -->
                                    <template x-if="assertion.evidenceDescription || assertion.evidenceScreenshotPath">
                                        <div class="assertion-full-evidence">
                                            <div class="evidence-label">Primary Evidence</div>
                                            <div class="evidence-description" x-text="assertion.evidenceDescription" x-show="assertion.evidenceDescription"></div>
                                            <template x-if="assertion.evidenceScreenshotPath">
                                                <img :src="'/' + assertion.evidenceScreenshotPath" class="evidence-screenshot-thumb" @click="openLightbox('/' + assertion.evidenceScreenshotPath)">
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Evidence Chain -->
                                    <template x-if="assertion.evidenceChain && assertion.evidenceChain.length > 0">
                                        <div class="assertion-full-evidence" style="margin-top: var(--space-sm);">
                                            <div class="evidence-label">Evidence Chain (<span x-text="assertion.evidenceChain.length"></span>)</div>
                                            <template x-for="(item, idx) in assertion.evidenceChain" :key="idx">
                                                <div style="margin-top: var(--space-sm); padding: var(--space-sm); background: var(--bg-secondary); border-radius: 6px;">
                                                    <div class="evidence-description" x-text="item.description"></div>
                                                    <template x-if="item.screenshotPath">
                                                        <img :src="'/' + item.screenshotPath" class="evidence-screenshot-thumb" style="max-width: 200px; margin-top: var(--space-xs);" @click="openLightbox('/' + item.screenshotPath)">
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Sources -->
                                    <template x-if="assertion.sources && assertion.sources.length > 0">
                                        <div class="assertion-full-sources">
                                            <div class="sources-label">Sources (<span x-text="assertion.sources.length"></span>)</div>
                                            <template x-for="src in assertion.sources" :key="src.id">
                                                <div class="source-item">
                                                    <div class="source-grade-dot" :class="src.relevanceGrade || 'ungraded'"></div>
                                                    <div class="source-content">
                                                        <a :href="src.source?.url" target="_blank" class="source-url-link" x-text="src.source?.url"></a>
                                                        <div class="source-quote" x-text="src.quote" x-show="src.quote"></div>
                                                        <template x-if="src.relevanceGrade">
                                                            <span class="source-grade-badge" :class="'grade-badge ' + src.relevanceGrade.toLowerCase().replace('_', '-')" x-text="src.relevanceGrade.replace('_', ' ')"></span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Reasoning -->
                                    <template x-if="assertion.reasoning && assertion.reasoning.length > 0">
                                        <div style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--border-light);">
                                            <div class="sources-label">Reasoning</div>
                                            <template x-for="r in assertion.reasoning" :key="r.id">
                                                <div style="font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; margin-top: var(--space-xs);" x-text="r.content"></div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Evidence Tab -->
                    <div class="tab-panel" x-show="activeTab === 'evidence'">
                        <template x-if="evidenceGallery.length === 0">
                            <div class="empty-tab">
                                <svg class="empty-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                                <div class="empty-tab-title">No evidence screenshots</div>
                                <p>Screenshots captured during research will appear here</p>
                            </div>
                        </template>
                        <div class="evidence-gallery-grid">
                            <template x-for="(item, idx) in evidenceGallery" :key="idx">
