                                <div class="evidence-gallery-item" @click="openLightbox('/' + item.path)">
                                    <img :src="'/' + item.path" class="evidence-gallery-img" :alt="item.description || 'Evidence screenshot'">
                                    <div class="evidence-gallery-caption" x-text="item.description || item.claim || 'Screenshot'"></div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- History Tab -->
                    <div class="tab-panel" x-show="activeTab === 'history'">
                        <template x-if="researchSessions.length === 0">
                            <div class="empty-tab">
                                <svg class="empty-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 14"/>
                                </svg>
                                <div class="empty-tab-title">No research sessions</div>
                                <p>Past research sessions will appear here</p>
                            </div>
                        </template>
                        <div class="session-timeline">
                            <template x-for="session in researchSessions" :key="session.id">
                                <div class="session-card">
                                    <div class="session-card-header">
                                        <span class="session-date" x-text="formatDate(session.createdAt)"></span>
                                        <span class="session-status-badge" :class="session.status" x-text="session.status"></span>
                                    </div>
                                    <div class="session-stats">
                                        <div class="session-stat">
                                            <span class="session-stat-value" x-text="session.totalAssertions || 0"></span>
                                            <span class="session-stat-label">Assertions</span>
                                        </div>
                                        <div class="session-stat">
                                            <span class="session-stat-value" x-text="session.totalExtractions || 0"></span>
                                            <span class="session-stat-label">Extractions</span>
                                        </div>
                                        <div class="session-stat">
                                            <span class="session-stat-value" x-text="session.totalScreenshots || 0"></span>
                                            <span class="session-stat-label">Screenshots</span>
                                        </div>
                                    </div>
                                    <template x-if="session.tasks && session.tasks.length > 0">
                                        <div class="session-tasks">
                                            <template x-for="task in session.tasks.slice(0, 5)" :key="task.id">
                                                <div class="session-task">
                                                    <div class="session-task-icon" :class="task.status">
                                                        <template x-if="task.status === 'COMPLETED'">&#10003;</template>
                                                        <template x-if="task.status === 'FAILED'">&#10007;</template>
                                                        <template x-if="task.status === 'IN_PROGRESS'">&#8635;</template>
                                                        <template x-if="task.status === 'PENDING'">&#8226;</template>
                                                    </div>
                                                    <span x-text="task.category" style="text-transform: capitalize;"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Lightbox - Enhanced for long screenshots -->
        <div class="lightbox" x-show="lightboxImage" @click="lightboxImage = null" @keydown.escape.window="lightboxImage = null" x-cloak>
            <button class="lightbox-close" @click.stop="lightboxImage = null">&times;</button>
            <div class="lightbox-content" @click.stop>
                <img :src="lightboxImage" :alt="'Evidence screenshot'">
            </div>
            <div class="lightbox-hint">Scroll to view full image &bull; Click outside or press ESC to close</div>
        </div>
    </div>

    <script>
        function entityPage() {
            return {
                loading: true,
                error: null,
                entity: null,
                stats: {},
                extractionsByType: {},
                assertions: [],
                evidenceGallery: [],
                researchSessions: [],
                activeTab: 'overview',
                lightboxImage: null,

                async init() {
                    // Get entity ID from URL
                    const pathParts = window.location.pathname.split('/');
                    const entityId = pathParts[pathParts.length - 1];

                    if (!entityId) {
                        this.error = 'No entity ID provided';
                        this.loading = false;
                        return;
                    }

                    try {
                        const res = await fetch(`/api/entities/${entityId}/full`);
                        const data = await res.json();

                        if (!data.success) {
                            throw new Error(data.error || 'Failed to load entity');
                        }

                        this.entity = data.data;
                        this.stats = data.data.stats;
                        this.extractionsByType = data.data.extractionsByType || {};
                        this.assertions = data.data.assertions || [];
                        this.evidenceGallery = data.data.evidenceGallery || [];
                        this.researchSessions = data.data.researchSessions || [];

                        // Update page title
                        document.title = `${this.entity.name} | Deep Research`;

                    } catch (err) {
                        console.error('Failed to load entity:', err);
                        this.error = err.message;
                    } finally {
                        this.loading = false;
                    }
                },

                formatUrl(url) {
                    if (!url) return '';
                    try {
                        return new URL(url).hostname;
                    } catch {
                        return url;
                    }
                },

                formatCategory(cat) {
                    if (!cat) return '';
                    return cat
                        .replace(/_/g, ' ')
                        .replace(/\bai\b/gi, 'AI')
                        .replace(/\bgenai\b/gi, 'GenAI')
                        .split(' ')
                        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                        .join(' ');
                },

                formatNumber(num) {
                    if (num === null || num === undefined) return '-';
                    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                    return num.toString();
                },

                formatDate(dateStr) {
                    if (!dateStr) return '-';
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                },

                formatBuzzComponent(key) {
                    return key
                        .replace(/([A-Z])/g, ' $1')
                        .replace(/^./, s => s.toUpperCase())
                        .trim();
                },

                openLightbox(src) {
                    this.lightboxImage = src;
                }
            };
        }
    </script>
</body>
</html>
